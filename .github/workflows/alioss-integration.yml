name: Alioss Integration Tests

on:
  workflow_dispatch:
    inputs:
      pr_ref:
        description: 'SHA of the PR head commit (for fork PRs)'
        required: false
        default: ''
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: alioss-integration
  cancel-in-progress: false

jobs:
  alioss-general-integration-tests:
    name:  Alioss General Integration Tests
    runs-on: ubuntu-latest
    # Run on push/workflow_dispatch, skip fork PRs
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pr_ref || github.sha }}
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Set up Aliyun CLI
        uses: aliyun/setup-aliyun-cli-action@v1
      - name: Install Ginkgo
        run: go install github.com/onsi/ginkgo/v2/ginkgo@latest
      - name: Setup Alioss Test Environment
        run: |
            export access_key_id="${{ secrets.ALI_ACCESS_KEY_ID }}"
            export access_key_secret="${{ secrets.ALI_ACCESS_KEY_SECRET }}"
            ./.github/scripts/alioss/setup.sh
      - name: Run Tests
        run: |
            export access_key_id="${{ secrets.ALI_ACCESS_KEY_ID }}"
            export access_key_secret="${{ secrets.ALI_ACCESS_KEY_SECRET }}"
            ./.github/scripts/alioss/run-int.sh
      - name: Teardown Alioss Test Environment
        if: always()
        run: |
            export access_key_id="${{ secrets.ALI_ACCESS_KEY_ID }}"
            export access_key_secret="${{ secrets.ALI_ACCESS_KEY_SECRET }}"
            ./.github/scripts/alioss/teardown.sh
      - name: Report fork PR status
        if: always() && inputs.pr_ref != ''
        uses: ./.github/actions/report-fork-status
        with:
          pr_ref: ${{ inputs.pr_ref }}
          name: Alioss General Integration Tests
